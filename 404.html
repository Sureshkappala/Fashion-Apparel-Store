<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Page Not Found — STACKLY</title>
  <meta name="description" content="The page, collection category, or fashion editorial you are searching for is in a different sector or has been moved!">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/style.css?v=2.4">
  <link rel="stylesheet" href="css/shop.css?v=2.4">
  <style>
    .error-404-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: #0B1320;
      color: #FFFFFF;
    }
    .error-404-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 4rem 1.5rem;
    }
    .error-404-num {
      font-family: var(--font-sans);
      font-size: clamp(6.5rem, 18vw, 11rem);
      font-weight: 800;
      line-height: 0.95;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #FF9900 0%, #FF5A36 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1.5rem;
      user-select: none;
    }
    .error-warning-icon {
      width: 54px;
      height: 54px;
      margin-bottom: 1.5rem;
      filter: drop-shadow(0 4px 12px rgba(245, 158, 11, 0.35));
    }
    .error-404-title {
      font-family: var(--font-sans);
      font-size: clamp(1.75rem, 4.5vw, 2.5rem);
      font-weight: 700;
      color: #FFFFFF;
      margin-bottom: 1rem;
      letter-spacing: -0.01em;
    }
    .error-404-desc {
      font-family: var(--font-sans);
      font-size: 1.05rem;
      color: #94A3B8;
      max-width: 580px;
      line-height: 1.6;
      margin: 0 auto 2.5rem;
    }
    .error-btn-group {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .btn-go-back {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.85rem 1.75rem;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: #FFFFFF;
      font-size: 0.9375rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }
    .btn-go-back:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.45);
      color: #FFFFFF;
      transform: translateY(-2px);
    }
    .btn-back-home {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.85rem 1.75rem;
      background: #0284C7;
      border: 1px solid #0284C7;
      color: #FFFFFF;
      font-size: 0.9375rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }
    .btn-back-home:hover {
      background: #0369A1;
      border-color: #0369A1;
      color: #FFFFFF;
      transform: translateY(-2px);
      box-shadow: 0 4px 18px rgba(2, 132, 199, 0.4);
    }
  </style>
</head>
<body class="error-404-page">

  <!-- Centered 404 Content -->
  <main class="error-404-body">
    <!-- Big Gradient 404 -->
    <div class="error-404-num">404</div>

    <!-- Yellow Warning Icon -->
    <div class="error-warning-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 100%; height: 100%;">
        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
        <line x1="12" y1="9" x2="12" y2="13"></line>
        <line x1="12" y1="17" x2="12.01" y2="17"></line>
      </svg>
    </div>

    <!-- Title & Description Matching Reference -->
    <h1 class="error-404-title">Lost in the Fashion Portal?</h1>
    <p class="error-404-desc">
      The page, collection category, or fashion editorial you are searching for is in a different sector or has been moved!
    </p>

    <!-- Two Action Buttons -->
    <div class="error-btn-group">
      <button type="button" class="btn-go-back" onclick="window.history.back();">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span>Go Back</span>
      </button>

      <a href="index.html" class="btn-back-home">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <span>Back to Home</span>
      </a>
    </div>
  </main>

  <!-- Minimal Dark Footer -->
  <footer style="padding: 1.25rem 2rem; border-top: 1px solid rgba(255, 255, 255, 0.08); text-align: center; font-size: 0.8125rem; color: #64748B;">
    &copy; 2026 STACKLY. All rights reserved. Designed for sartorial excellence.
  </footer>

</body>
</html>
